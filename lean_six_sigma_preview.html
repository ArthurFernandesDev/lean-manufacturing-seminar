<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lean & Six Sigma</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #08101e; --surface: #0d1526; --card: #111e33; --card2: #162438;
    --border: #1c2d45; --gold: #c8a84b; --goldDim: rgba(200,168,75,0.12);
    --goldB: rgba(200,168,75,0.25); --blue: #4a8fc4; --green: #3aac82;
    --red: #d95f5f; --text: #e2e8f4; --muted: #6e849e; --dim: #3d4e62;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .pres {
  display: flex;
  width: 100%;
  min-height: 100vh;; background: var(--bg); border-radius: 8px; overflow: hidden; font-family: 'IBM Plex Sans', system-ui, sans-serif; border: 1px solid var(--border); }
  .sidebar { width: 200px; min-width: 200px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .s-header { padding: 14px 12px 12px; border-bottom: 1px solid var(--border); }
  .s-label { font-size: 9px; font-weight: 700; letter-spacing: 1.8px; text-transform: uppercase; color: var(--gold); margin-bottom: 2px; }
  .s-sub { font-size: 11px; color: var(--muted); line-height: 1.4; }
  .s-nav { flex: 1; overflow-y: auto; padding: 6px 0; }
  .s-nav::-webkit-scrollbar { width: 3px; }
  .s-nav::-webkit-scrollbar-track { background: transparent; }
  .s-nav::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .nav-item { padding: 7px 12px; font-size: 11px; color: var(--muted); cursor: pointer; border-left: 2px solid transparent; transition: all 0.15s; line-height: 1.35; }
  .nav-item:hover { background: var(--card); color: var(--text); }
  .nav-item.active { background: var(--card); border-left-color: var(--gold); color: var(--text); }
  .s-foot { padding: 10px 12px; border-top: 1px solid var(--border); }
  .prog-label { display: flex; justify-content: space-between; margin-bottom: 5px; }
  .prog-label span { font-size: 9px; color: var(--dim); }
  .prog-label strong { font-size: 9px; color: var(--gold); }
  .prog-bar { height: 2px; background: var(--border); border-radius: 1px; }
  .prog-fill { height: 100%; background: var(--gold); border-radius: 1px; transition: width 0.3s; }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .top-prog { height: 2px; background: var(--border); }
  .top-fill { height: 100%; background: linear-gradient(to right, var(--blue), var(--gold)); transition: width 0.3s; }
  .content { flex: 1; padding: 22px 28px 14px; overflow-y: auto; }
  .content::-webkit-scrollbar { width: 4px; }
  .content::-webkit-scrollbar-track { background: transparent; }
  .content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .footer { display: flex; justify-content: space-between; align-items: center; padding: 10px 28px; border-top: 1px solid var(--border); background: rgba(13,21,38,0.7); }
  .btn { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 6px 16px; border-radius: 4px; font-size: 11px; cursor: pointer; transition: all 0.2s; font-family: inherit; }
  .btn:hover:not(:disabled) { color: var(--text); border-color: var(--gold); }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn-next { background: var(--gold); border-color: var(--gold); color: #08101e; font-weight: 600; }
  .btn-next:hover:not(:disabled) { opacity: 0.85; border-color: var(--gold); color: #08101e; }
  .dots { display: flex; gap: 4px; align-items: center; }
  .dot { height: 4px; border-radius: 2px; cursor: pointer; transition: all 0.3s; background: var(--border); }
  .dot.active { background: var(--gold); }
  .dot.past { background: var(--dim); }
  .tag { background: var(--goldDim); color: var(--gold); border: 1px solid var(--goldB); font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; padding: 2px 8px; border-radius: 2px; font-weight: 500; display: inline-block; }
  .sec-title { font-family: 'Playfair Display', Georgia, serif; font-size: 24px; font-weight: 600; color: var(--text); line-height: 1.2; margin-top: 8px; }
  .divider { width: 36px; height: 2px; background: var(--gold); border-radius: 1px; margin-top: 10px; margin-bottom: 18px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 5px; padding: 14px 16px; }
  .card2 { background: rgba(74,143,196,0.06); border: 1px solid rgba(74,143,196,0.2); border-radius: 5px; padding: 14px 16px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .grid4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; }
  .quote { border-left: 3px solid var(--gold); padding: 9px 14px; background: var(--goldDim); border-radius: 0 4px 4px 0; margin-top: 16px; }
  .quote p { font-family: Georgia, serif; font-style: italic; color: var(--muted); font-size: 12px; line-height: 1.65; }
  .quote small { display: block; color: var(--dim); font-size: 10px; margin-top: 5px; font-weight: 500; }
  .t-h { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 5px; }
  .t-m { font-size: 11.5px; color: var(--muted); line-height: 1.6; }
  .t-g { font-size: 11px; color: var(--dim); }
  .accent-bar { width: 3px; border-radius: 2px; flex-shrink: 0; }
  .slide { animation: sIn 0.35s ease both; }
  @keyframes sIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
  .row { display: flex; gap: 10px; align-items: flex-start; }
  .circle { width: 22px; height: 22px; border-radius: 50%; background: var(--goldDim); border: 1px solid var(--goldB); display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: var(--gold); flex-shrink: 0; }
  .timeline-dot { font-size: 9px; font-weight: 600; color: var(--gold); min-width: 34px; padding-top: 2px; }
  .belt-bar { height: 3px; background: var(--border); border-radius: 1px; margin: 4px 0 6px; }
  .belt-fill { height: 100%; border-radius: 1px; transition: width 1.2s ease; }
  .stat { text-align: center; padding: 16px 12px; }
  .stat-n { font-family: Georgia, serif; font-size: 26px; font-weight: 700; margin-bottom: 5px; }
  .stat-l { font-size: 11px; color: var(--muted); line-height: 1.35; }
  .check { color: var(--green); font-weight: 700; font-size: 11px; margin-right: 4px; }
  .capa-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; }
  .capa-h1 { font-family: Georgia, serif; font-size: 42px; font-weight: 700; color: var(--text); line-height: 1.15; margin: 16px 0 12px; }
  .capa-sub { color: var(--muted); font-size: 13px; font-weight: 300; line-height: 1.5; max-width: 420px; }
  .capa-meta { display: flex; gap: 36px; margin-top: 32px; padding-top: 22px; border-top: 1px solid var(--border); }
  .capa-meta-item { text-align: center; }
  .capa-k { font-size: 9px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--dim); }
  .capa-v { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .deco-line { position: absolute; height: 1px; background: linear-gradient(to right, transparent, var(--gold)); }
  .dmaic-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .dmaic-top { display: flex; gap: 0; margin-bottom: 10px; align-items: center; }
  .dmaic-b { flex: 1; padding: 8px 6px; text-align: center; border-radius: 4px; }
  .dmaic-arr { font-size: 12px; color: var(--dim); padding: 0 2px; flex-shrink: 0; }
  .tbl { width: 100%; border-collapse: collapse; }
  .tbl th { padding: 9px 12px; text-align: left; font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--dim); border-bottom: 1px solid var(--border); }
  .tbl td { padding: 9px 12px; font-size: 11.5px; color: var(--text); border-bottom: 1px solid var(--border); line-height: 1.45; }
  .tbl tr:last-child td { border-bottom: none; }
  .tbl tr:hover td { background: rgba(255,255,255,0.015); }
  .badge { font-size: 9px; background: var(--goldDim); color: var(--gold); border: 1px solid var(--goldB); padding: 2px 7px; border-radius: 2px; font-weight: 500; white-space: nowrap; }
  .ref-key { background: var(--goldDim); color: var(--gold); border: 1px solid var(--goldB); font-size: 9px; padding: 2px 7px; border-radius: 2px; display: inline-block; }
  .venn-wrap { display: flex; align-items: center; justify-content: center; position: relative; height: 110px; }
  .circle-l { position: absolute; width: 110px; height: 110px; border-radius: 50%; background: rgba(74,143,196,0.1); border: 1px solid rgba(74,143,196,0.3); display: flex; flex-direction: column; align-items: center; justify-content: center; left: 15%; }
  .circle-r { position: absolute; width: 110px; height: 110px; border-radius: 50%; background: rgba(58,172,130,0.1); border: 1px solid rgba(58,172,130,0.3); display: flex; flex-direction: column; align-items: center; justify-content: center; right: 15%; }
  .circle-c { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); text-align: center; z-index: 2; }
</style>

<div class="pres" id="pres">
  <nav class="sidebar">
    <div class="s-header">
      <div class="s-label">Seminário</div>
      <div class="s-sub">Lean Manufacturing<br>& Six Sigma</div>
    </div>
    <div class="s-nav" id="nav"></div>
    <div class="s-foot">
      <div class="prog-label">
        <span>Progresso</span>
        <strong id="prog-text">1 / 14</strong>
      </div>
      <div class="prog-bar">
        <div class="prog-fill" id="prog-fill" style="width:0%"></div>
      </div>
    </div>
  </nav>

  <main class="main">
    <div class="top-prog"><div class="top-fill" id="top-fill" style="width:0%"></div></div>
    <div class="content" id="content"></div>
    <div class="footer">
      <button class="btn" id="btn-prev" onclick="go(cur-1)">← Anterior</button>
      <div class="dots" id="dots"></div>
      <button class="btn btn-next" id="btn-next" onclick="go(cur+1)">Próximo →</button>
    </div>
  </main>
</div>

<script>
let cur = 0;

const slides = [
  { nav: "Capa", html: () => `
    <div class="capa-wrap slide">
      <div><span class="tag">Seminário Acadêmico · Gestão de Produção</span></div>
      <h1 class="capa-h1">Lean Manufacturing<br><span style="color:var(--gold)">&</span> Six Sigma</h1>
      <p class="capa-sub">Fundamentos, Ferramentas e Aplicações na Gestão de Processos Industriais</p>
      <div style="
  margin-top: 28px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 13px;
  line-height: 1.8;
  text-align: center;
">
  <strong style="color: var(--text);">Elaborado por:</strong><br>
  Arthur Fernandes<br>
  Alice Carolina <br>
  Alyne Maria 
</div>
    </div>` },

  { nav: "01 Introdução", html: () => `
    <div class="slide">
      <div><span class="tag">01</span></div>
      <div class="sec-title">Contexto e Objetivos</div>
      <div class="divider"></div>
      <div class="grid3" style="margin-bottom:12px">
        ${[["🌐","O Cenário Global","A partir do séc. XX, o aumento da competitividade global exigiu revisão profunda dos modelos produtivos. Eficiência tornou-se condição de sobrevivência."],
           ["⚙️","O Desafio Competitivo","Reduzir custos sem comprometer qualidade tornou-se a equação central da gestão moderna. Processos ineficientes custam market share."],
           ["📐","O Papel das Metodologias","Lean e Six Sigma surgem como respostas estruturadas: a primeira atacando desperdício, a segunda combatendo variabilidade."]].map(([ic,t,d])=>`
          <div class="card"><div style="font-size:18px;margin-bottom:8px">${ic}</div><div class="t-h">${t}</div><p class="t-m">${d}</p></div>`).join('')}
      </div>
      <div class="card2"><div class="grid2">
        <div><div style="font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--blue);font-weight:500;margin-bottom:7px">Objetivo do Lean</div><p class="t-m">Eliminar atividades que não agregam valor, otimizar fluxo de produção e reduzir lead times em toda a cadeia produtiva.</p></div>
        <div><div style="font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--green);font-weight:500;margin-bottom:7px">Objetivo do Six Sigma</div><p class="t-m">Reduzir defeitos e variações por meio de metodologia estatística, atingindo 3,4 falhas por milhão de oportunidades.</p></div>
      </div></div>
      <div class="quote"><p>"Todo o que estamos fazendo é observar o tempo desde o pedido do cliente até o recebimento, e estamos reduzindo esse período."</p><small>— Taiichi Ohno, O Sistema Toyota de Produção (1997)</small></div>
    </div>` },

  { nav: "02 Lean Manufacturing", html: () => `
    <div class="slide">
      <div><span class="tag">02</span></div>
      <div class="sec-title">Lean Manufacturing</div>
      <div class="divider"></div>
      <div class="grid2" style="margin-bottom:12px">
        <div class="card">
          <div style="margin-bottom:8px"><span class="tag">Conceito</span></div>
          <p class="t-m">Filosofia de gestão voltada à eliminação de desperdícios em todos os estágios produtivos. Entregar mais valor ao cliente com menos recursos.</p>
          <p class="t-m" style="margin-top:7px">Segundo <strong style="color:var(--text);font-weight:500">Womack, Jones e Roos (2004)</strong>, o Lean representa uma ruptura com o modelo fordista, promovendo flexibilidade e fluxo contínuo.</p>
        </div>
        <div class="card">
          <div style="margin-bottom:8px"><span class="tag">Origem Histórica</span></div>
          ${[["1950s","Toyota Production System","Desenvolvido por Taiichi Ohno na Toyota Motor, no Japão pós-guerra."],
             ["1988","Termo 'Lean'","Cunhado por John Krafcik no MIT, pesquisa que originou A Máquina que Mudou o Mundo."],
             ["1990s","Expansão Global","Disseminação para saúde, construção, serviços e logística."]].map(([a,t,d],i)=>`
            <div style="display:flex;gap:10px;${i<2?'margin-bottom:10px':''}">
              <span class="timeline-dot">${a}</span>
              <div><div class="t-h" style="font-size:11.5px">${t}</div><span class="t-g">${d}</span></div>
            </div>`).join('')}
        </div>
      </div>
      <div class="card">
        <div style="margin-bottom:10px"><span class="tag">Os 5 Princípios — Womack & Jones</span></div>
        <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px">
          ${[["1","Valor","Definir valor na ótica do cliente"],
             ["2","Fluxo de Valor","Mapear etapas que criam valor"],
             ["3","Fluxo Contínuo","Criar fluxo sem interrupções"],
             ["4","Produção Puxada","Produzir conforme demanda real"],
             ["5","Perfeição","Busca contínua — zero desperdício"]].map(([n,t,d])=>`
            <div style="background:var(--surface);border-radius:4px;padding:10px;border:1px solid var(--border);text-align:center">
              <div class="circle" style="margin:0 auto 7px">${n}</div>
              <div style="font-size:11px;font-weight:600;color:var(--text);margin-bottom:4px">${t}</div>
              <div style="font-size:10px;color:var(--muted);line-height:1.4">${d}</div>
            </div>`).join('')}
        </div>
      </div>
    </div>` },

  { nav: "03 Os 8 Desperdícios", html: () => `
    <div class="slide">
      <div><span class="tag">03</span></div>
      <div class="sec-title">Os 8 Desperdícios do Lean</div>
      <div class="divider"></div>
      <p class="t-m" style="margin-bottom:14px">Ohno identificou 7 desperdícios (muda) no TPS. O oitavo — talento humano — foi incorporado por Jeffrey Liker em The Toyota Way (2004).</p>
      <div class="grid4">
        ${[["🏭","Superprodução","Produzir mais ou antes do necessário. O maior desperdício, pois encobre outros problemas.","var(--red)"],
           ["⏳","Espera","Tempo em que trabalhadores ou máquinas ficam parados aguardando material ou informação.","var(--blue)"],
           ["🚚","Transporte","Movimentação desnecessária de materiais sem nenhuma transformação ou valor agregado.","#9b6fc4"],
           ["⚙️","Processamento Excessivo","Etapas além do necessário para atender as especificações do cliente.","var(--gold)"],
           ["📦","Estoque","Acúmulo de materiais além do mínimo necessário para o fluxo produtivo.","var(--green)"],
           ["🚶","Movimentação","Deslocamento desnecessário de pessoas. Leiautes inadequados são a principal causa.","#4abfcf"],
           ["🔧","Defeitos","Itens com erros que exigem retrabalho ou descarte, consumindo recursos sem gerar valor.","var(--red)"],
           ["💡","Talento Humano","Subutilização do potencial intelectual e criativo dos colaboradores.","#e8944a"]].map(([ic,t,d,c])=>`
          <div class="card" style="height:100%">
            <div style="display:flex;align-items:center;gap:7px;margin-bottom:7px">
              <span style="font-size:16px">${ic}</span>
              <div style="width:3px;height:14px;background:${c};border-radius:2px;flex-shrink:0"></div>
            </div>
            <div class="t-h" style="font-size:12px;margin-bottom:5px">${t}</div>
            <p style="font-size:11px;color:var(--muted);line-height:1.5">${d}</p>
          </div>`).join('')}
      </div>
      <div class="quote" style="margin-top:12px"><p>"O Lean não é sobre fazer as pessoas trabalharem mais rápido. É sobre eliminar os obstáculos que as impedem de trabalhar com mais eficiência."</p><small>— Adaptado de Pompeu & Rabaioli, Multitemas, 2015</small></div>
    </div>` },

  { nav: "04 Ferramentas Lean", html: () => `
    <div class="slide">
      <div><span class="tag">04</span></div>
      <div class="sec-title">Ferramentas Lean</div>
      <div class="divider"></div>
      <div class="grid2">
        ${[["5S","Seiri · Seiton · Seiso · Seiketsu · Shitsuke","var(--blue)","Metodologia de organização baseada em 5 palavras japonesas: Utilização, Organização, Limpeza, Padronização e Disciplina — estruturando o ambiente de trabalho de forma sistemática.","Redução de acidentes;Ambiente mais produtivo;Cultura de disciplina;Padrões visuais claros"],
           ["Kaizen","Melhoria Contínua","var(--green)","Filosofia japonesa — 'mudança para melhor'. Representa a melhoria incremental dos processos, envolvendo todos os níveis da organização em ciclos rápidos de aprendizado.","Redução de custos;Engajamento de equipes;Ciclos rápidos de melhoria;Cultura de aprendizado"],
           ["Kanban","Sinalização Visual","var(--gold)","Sistema visual que controla o fluxo de trabalho e a reposição de materiais. Garante produção puxada pela demanda real, evitando superprodução e acúmulo de estoque.","Controle do WIP;Produção sob demanda;Identificação de gargalos;Redução de estoques"],
           ["Just in Time","JIT","#9b6fc4","Propõe a entrega do item certo, na quantidade certa, no momento certo. Desenvolvido na Toyota, reduz dramaticamente estoques em toda a cadeia produtiva.","Estoque mínimo;Redução do lead time;Alta responsividade;Menor capital imobilizado"]].map(([t,sub,c,d,pts])=>`
          <div class="card">
            <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:9px">
              <div>
                <div style="font-family:Georgia,serif;font-size:16px;font-weight:600;color:var(--text)">${t}</div>
                <div style="font-size:10px;color:${c};font-weight:500;margin-top:2px">${sub}</div>
              </div>
              <div style="width:3px;height:36px;background:${c};border-radius:2px"></div>
            </div>
            <p style="font-size:11.5px;color:var(--muted);line-height:1.6;margin-bottom:10px">${d}</p>
            ${pts.split(';').map(p=>`<div style="display:flex;align-items:center;gap:7px;margin-bottom:5px"><div style="width:4px;height:4px;border-radius:50%;background:${c};flex-shrink:0"></div><span style="font-size:11px;color:var(--muted)">${p}</span></div>`).join('')}
          </div>`).join('')}
      </div>
    </div>` },

  { nav: "05 Benefícios do Lean", html: () => `
    <div class="slide">
      <div><span class="tag">05</span></div>
      <div class="sec-title">Benefícios do Lean Manufacturing</div>
      <div class="divider"></div>
      <div class="grid3" style="margin-bottom:12px">
        ${[["15–40%","Redução de Custos Operacionais","var(--green)"],
           ["20–50%","Aumento de Produtividade","var(--blue)"],
           ["50–90%","Redução de Lead Time","var(--gold)"]].map(([v,l,c])=>`
          <div class="card stat"><div class="stat-n" style="color:${c}">${v}</div><div class="stat-l">${l}</div></div>`).join('')}
      </div>
      <div class="grid2">
        ${[["💰","Redução de Custos","Eliminação de atividades sem valor agregado;Menor necessidade de retrabalho;Redução de desperdício de materiais;Diminuição de capital imobilizado"],
           ["📈","Maior Produtividade","Fluxo de trabalho mais eficiente;Menos tempo em esperas e deslocamentos;Processos padronizados e previsíveis;Melhor aproveitamento da capacidade"],
           ["🗂️","Organização e Qualidade","Ambientes mais organizados com 5S;Detecção precoce de defeitos;Maior satisfação dos colaboradores;Cultura de disciplina e melhoria"],
           ["🚀","Eficiência Operacional","Resposta ágil às demandas do mercado;Maior flexibilidade na linha de produção;Redução do tempo de setup;Entregas mais confiáveis ao cliente"]].map(([ic,t,pts])=>`
          <div class="card">
            <div style="display:flex;align-items:center;gap:7px;margin-bottom:10px">
              <span style="font-size:17px">${ic}</span>
              <span class="t-h">${t}</span>
            </div>
            ${pts.split(';').map(p=>`<div style="display:flex;gap:7px;margin-bottom:5px"><span style="color:var(--green);font-weight:700;font-size:12px">›</span><span style="font-size:11.5px;color:var(--muted);line-height:1.45">${p}</span></div>`).join('')}
          </div>`).join('')}

function render() {
  const total = slides.length;
  const pct = cur === 0 ? 0 : (cur / (total - 1)) * 100;

  document.getElementById('content').innerHTML = slides[cur].html();
  document.getElementById('prog-text').textContent = `${cur+1} / ${total}`;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('top-fill').style.width = pct + '%';

  const nav = document.getElementById('nav');
  nav.innerHTML = slides.map((s,i) => `<div class="nav-item ${i===cur?'active':''}" onclick="go(${i})">${s.nav}</div>`).join('');

  const dots = document.getElementById('dots');
  dots.innerHTML = slides.map((_,i) => `<div class="dot ${i===cur?'active':i<cur?'past':''}" style="width:${i===cur?18:4}px" onclick="go(${i})"></div>`).join('');

  document.getElementById('btn-prev').disabled = cur === 0;
  document.getElementById('btn-next').disabled = cur === total - 1;

  document.getElementById('content').scrollTop = 0;
}

function go(idx) {
  if (idx < 0 || idx >= slides.length) return;
  cur = idx;
  render();
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') go(cur + 1);
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') go(cur - 1);
});

render();
</script>
</body>
</html>
